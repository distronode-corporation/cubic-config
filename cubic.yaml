# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
# Organization-wide cubic review settings. A repo-level cubic.yaml would replace
# these fields for that repo, so repos do not carry their own.
version: 1
reviews:
  enabled: true
  sensitivity: high
  external_contributors_require_manual_review: true
  ultrareview: disabled
  # Learn review patterns from the code owner.
  senior_reviewers: [seandean]
  # Applies to every repository, in PR reviews and in local `cubic review` runs.
  custom_instructions: |
    These are Distronode's open-source repositories. Every one is public.
    - Never accept a secret, token, private key or credential in the diff, including in tests, fixtures, logs or docs.
    - Public repositories carry no infrastructure runbooks: no IAM steps, account IDs, internal hostnames, or operational procedures for Distronode's own servers.
    - Coverage floors only go up. Flag a lowered threshold, a new coverage exclusion, or a coverage pragma. Unreachable code is deleted (with a one-line comment), not excluded.
    - Behaviour must be deterministic: flag fixed sleeps, wall-clock timing or test-order dependence that a test relies on.
    - A response or wire field is never renamed, removed or added without the matching contract or fixture change. Installed apps depend on it.
    - French (fr-CA) copy has no English left in it, and wire values (codes, enum strings) are never translated.
    - Written docs and user-facing copy use no em dashes.
    Report real defects with a concrete failure scenario. Skip style preferences the repository's linters already enforce.
  custom_rules:
    # Every repository has a CONTRIBUTING.md with its own build, test and coverage rules.
    - name: Repository contributing rules
      description: Enforce this repository's CONTRIBUTING.md (build, test, coverage and release rules). Flag changes that break a rule it states.
      file_paths:
        - CONTRIBUTING.md
  ignore:
    files:
      # Generated or vendored files. Each has a required CI check that it matches its source.
      - "plugins/claude-code/dist/"
      - "**/generated/**"
      - "**/Generated/**"
      - "**/*.g.cs"
      - "crates/district-app/src/l10n/text.rs"
      - "crates/district-app/po/"
      - "app/src/l10n-fr/"
      - "app/src/main/res/values/strings.xml"
      - "app/src/main/res/values/api_errors.xml"
      - "app/src/main/res/values/numbers.xml"
      - "app/src/main/res/values/scheduling.xml"
      - "app/src/main/res/values/wire_labels.xml"
      - "tools/l10n/*.py"
      - "tools/l10n/SHA256SUMS"
      - "**/*.min.js"
      - "packaging/flatpak/cargo-sources.json"
      # Tests. Skipped to stay inside the public fair-use quota; CI runs every suite.
      - "**/__tests__/**"
      - "**/__snapshots__/**"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.test.js"
      - "**/*.spec.ts"
      - "**/tests/**"
      - "**/Tests/**"
      - "**/*Tests/**"
      - "**/*Tests.swift"
      - "**/*.Tests/**"
      - "**/*Tests.cs"
      - "**/src/test/**"
      - "**/src/androidTest/**"
      - "**/test_*.py"
      - "**/*_test.py"
      - "**/*_test.go"
      - "**/*_test.rs"
      # Lockfiles
      - "**/package-lock.json"
      - ".github/**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/Cargo.lock"
      - "**/gradle.lockfile"
      - "**/packages.lock.json"
      - "go.sum"
      - "uv.lock"
      - "Package.resolved"
    head_branches:
      - "dependabot/**"
      # Release PRs into main: each change was already reviewed on its PR into release/*,
      # where a ruleset makes open review threads block the merge.
      - "release/**"
    pr_labels:
      - skip-cubic
pr_descriptions:
  generate: false
  cubic_review_link: false
issues:
  fix_with_cubic_buttons: false
  pr_comment_fixes: false
  auto_fix: "off"
